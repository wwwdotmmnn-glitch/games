#frames iframe.on{display:block}
#lockbox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
#lockbox .card{text-align:center;max-width:420px}
#lockbox .ico{font-size:44px;line-height:1}
#lockbox h2{font-size:26px;line-height:1.35}
#adm{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}

.err{color:var(--hot);font-weight:700;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{color:var(--mut);font-size:12px}
.scroll{overflow-x:auto}
.note{color:var(--mut);font-size:14px;margin:0}

, \"إنشاء مجموعة\": \"Groep maken\", \"الانضمام بكود\": \"Deelnemen met code\", \"اسمك\": \"Je naam\", \"اكتب اسمك\": \"Typ je naam\", \"كود المجموعة\": \"Groepscode\", \"إنشاء المجموعة\": \"Groep maken\", \"دخول\": \"Deelnemen\", \"ستحصل على كود قصير. أعطه للبقية ليدخلوا مجموعتك.\": \"Je krijgt een korte code. Geef die aan de anderen zodat ze kunnen meedoen.\", \"اكتب اسمك أولاً.\": \"Typ eerst je naam.\", \"الكود مكوّن من 5 خانات.\": \"De code bestaat uit 5 tekens.\", \"لم نجد مجموعة بهذا الكود. تأكد منه.\": \"Geen groep gevonden met deze code. Controleer hem.\", \"المجموعة ممتلئة (14 لاعباً).\": \"De groep is vol (14 spelers).\", \"تعذّر الاتصال. تأكد من رابط Supabase والمفتاح داخل الملف.\": \"Verbinden mislukt. Controleer de Supabase-URL en sleutel in het bestand.\", \"تعذّر الاتصال بالخادم. تحقق من الإنترنت ومن إعدادات Supabase.\": \"Kan geen verbinding maken met de server. Controleer internet en Supabase-instellingen.\", \"انقطع منسّق اللعبة قبل نقل البيانات. اضغطوا «جاهز» لبدء جولة جديدة.\": \"De spelleider viel weg voordat de gegevens waren overgedragen. Tik op «Klaar» voor een nieuwe ronde.\", \"جارٍ الاتصال…\": \"Verbinden…\", \"ننتظر ردّ المجموعة.\": \"We wachten op de groep.\", \"جاهز ✓\": \"Klaar ✓\", \"أنت\": \"Jij\", \"النقاط\": \"Scores\", \"عشوائي\": \"Willekeurig\", \"عن بعد (كتابة)\": \"Op afstand (typen)\", \"في مكان واحد\": \"Op één plek\", \"نوع اللعب\": \"Speltype\", \"الفئة\": \"Categorie\", \"اللاعبون\": \"Spelers\", \"من\": \"van\", \"نحتاج {min} لاعبين على الأقل. أعطِ الكود {code} لأصدقائك.\": \"We hebben minstens {min} spelers nodig. Geef de code {code} aan je vrienden.\", \"الجميع جاهزون. تبدأ اللعبة الآن.\": \"Iedereen is klaar. Het spel begint nu.\", \"تبدأ اللعبة تلقائياً عندما يضغط جميع اللاعبين «أنا جاهز» ({rc} من {n}).\": \"Het spel start automatisch zodra alle spelers op «Ik ben klaar» drukken ({rc} van {n}).\", \"المنشئ يختار الفئة ونوع اللعب، والبرنامج يختار الكلمة والدخيل ومن يبدأ.\": \"De maker kiest de categorie en het spelty   nl:{title:"Beheer",pw:"Wachtwoord",login:"Inloggen",bad:"Wachtwoord onjuist",net:"Geen verbinding",off:"Niet actief: Supabase-URL en sleutel zijn niet ingevuld.",close:"Sluiten",locks:"Spellen vergrendelen",locked:"Vergrendeld",open:"Open",lock:"Vergrendelen",unlock:"Ontgrendelen",lockall:"Alles vergrendelen",unlockall:"Alles ontgrendelen",report:"Spelersrapport",clear:"Gegevens wissen",sure:"Alle spelersgegevens wissen?",name:"Naam",game:"Spel",time:"Tijd",all:"Alle",none:"Geen gegevens",count:"Aantal records"}
};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var L=ls("mk_lang")||(ls("bs_lang")==="nl"?"nl":"ar");
var A=function(k){return AT[L][k]};
var cur=null,opened={},LK={};

/* ---------- backend ---------- */
function rpc(fn,body){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},6000);
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",signal:ctl?ctl.signal:undefined,
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})})
  .then(function(r){clearTimeout(to);if(!r.ok)throw new Error(r.status);return r.text()})
  .then(function(t){return t?JSON.parse(t):null});
}
function loadLocks(){
  if(!ON)return Promise.resolve();
  return rpc("get_locks").then(function(o){LK=o||{}}).catch(function(){});
}

/* ---------- screens ---------- */
function draw(){
  var t=TXT[L],h=document.documentElement;
  h.lang=L;h.dir=L==="ar"?"rtl":"ltr";
  ["wt","ws","d1","d2","sg"].forEach(function(k){$(k).textContent=t[k]});
  $("n1").textContent=GN.g1[L];$("n2").textContent=GN.g2[L];
  $("lg").textContent=t.lg;$("back").textContent=t.back;$("lkt").textContent=t.lk;
  $("gt").textContent=cur?GN[cur][L]:"";
  document.title=L==="ar"?"ألعاب مالك الخياط":"Spellen van Malek Alkhyat";
}
function sync(){
  var locked=!!(cur&&LK[cur]);
  Array.prototype.forEach.call($("frames").children,function(f){
    if(f.tagName==="IFRAME")f.classList.toggle("on",f.id==="f_"+cur&&!locked);
  });
  $("lockbox").style.display=locked?"flex":"none";
}
function show(id){
  cur=id;
  if(!LK[id]&&!$("f_"+id)){
    var fr=document.createElement("iframe");fr.id="f_"+id;fr.setAttribute("title",id);fr.srcdoc=GAMES[id];
    $("frames").appendChild(fr);opened[id]=1;
  }
  $("play").classList.add("on");$("home").style.display="none";draw();sync();
}
function openGame(id){
  Promise.race([loadLocks(),new Promise(function(r){setTimeout(r,2500)})]).then(function(){show(id)});
}
function goHome(){cur=null;$("play").classList.remove("on");$("home").style.display="";draw();sync()}
$("g1").onclick=function(){openGame("g1")};
$("g2").onclick=function(){openGame("g2")};
$("back").onclick=goHome;

/* ---------- language button: tap = switch, long press = hidden control panel ---------- */
var lt=null,lp=false,lgb=$("lg");
lgb.addEventListener("pointerdown",function(){lp=false;clearTimeout(lt);lt=setTimeout(function(){lp=true;askPw("")},700)});
["pointerup","pointerleave","pointercancel"].forEach(function(ev){lgb.addEventListener(ev,function(){clearTimeout(lt)})});
lgb.addEventListener("contextmenu",function(e){e.preventDefault()});
lgb.addEventListener("click",function(){
  if(lp){lp=false;return}
  L=L==="ar"?"nl":"ar";ss("mk_lang",L);draw();
});

/* ---------- logging: record who joined which game and when ---------- */
function joined(){
  var r=[];
  try{var s=JSON.parse(sessionStorage.getItem("bs_sess")||"null");if(opened.g1&&s&&s.code&&s.name)r.push(["g1",s.code,s.name])}catch(e){}
  try{var c=localStorage.getItem("gc"),m=JSON.parse(localStorage.getItem("gm")||"null");if(opened.g2&&c&&m&&m.name)r.push(["g2",c,m.name])}catch(e){}
  return r;
}
var logged=[];try{logged=JSON.parse(ls("mk_logged")||"[]")}catch(e){}
function watch(){
  if(!ON)return;
  joined().forEach(function(j){
    var key=j[0]+":"+j[1]+":"+j[2];
    if(logged.indexOf(key)>=0)return;
    rpc("log_play",{n:j[2],g:j[0]}).then(function(){
      logged.push(key);logged=logged.slice(-60);ss("mk_logged",JSON.stringify(logged));
    }).catch(function(){});
  });
  if(cur)loadLocks().then(sync);
}
setInterval(watch,5000);

/* ---------- hidden control panel ---------- */
var PW="",ADM={locks:{},rows:null,flt:"all"};
function admShow(h){var el=$("adm");el.innerHTML='<div class="adm-in">'+h+'</div>';el.classList.add("on")}
function admClose(){var el=$("adm");el.classList.remove("on");el.innerHTML="";PW="";ADM.rows=null;ADM.flt="all"}
function askPw(err){
  var h='<div class="card"><h2>'+esc(A("title"))+'</h2>';
  if(!ON)h+='<p class="note">'+esc(A("off"))+'</p>';
  else h+='<input id="apw" type="password" autocomplete="off" placeholder="'+esc(A("pw"))+'">'+(err?'<p class="err">'+esc(A(err))+'</p>':'')+'<button class="btn" data-act="login">'+esc(A("login"))+'</button>';
  h+='<button class="btn ghost" data-act="close">'+esc(A("close"))+'</button></div>';
  admShow(h);
  var i=$("apw");if(i)setTimeout(function(){i.focus()},50);
}
function fmt(ts){try{return new Date(ts).toLocaleString(L==="ar"?"ar-u-nu-latn":"nl-NL",{dateStyle:"short",timeStyle:"short"})}catch(e){return String(ts)}}
function table(){
  var rows=ADM.rows.filter(function(r){return ADM.flt==="all"||r.game===ADM.flt});
  var h='<div class="row"><span class="note">'+esc(A("count"))+': <b>'+rows.length+'</b></span><select id="afl" style="width:auto">'+
    [["all",A("all")],["g1",GN.g1[L]],["g2",GN.g2[L]]].map(function(o){return '<option value="'+o[0]+'"'+(ADM.flt===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'}).join("")+'</select></div>';
  if(!rows.length)return h+'<p class="note">'+esc(A("none"))+'</p>';
  return h+'<div class="scroll"><table class="tbl"><tr><th>'+esc(A("name"))+'</th><th>'+esc(A("game"))+'</th><th>'+esc(A("time"))+'</th></tr>'+
    rows.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+esc((GN[r.game]||{})[L]||r.game)+'</td><td>'+esc(fmt(r.ts))+'</td></tr>'}).join("")+'</table></div>';
}
function panel(){
  var h='<div class="card"><h2>'+esc(A("title"))+'</h2><h3>'+esc(A("locks"))+'</h3>';
  ["g1","g2"].forEach(function(g){
    var l=!!ADM.locks[g];
    h+='<div class="row"><span>'+esc(GN[g][L])+' — <b>'+esc(l?A("locked"):A("open"))+'</b></span><button class="btn sm'+(l?'':' ghost')+'" data-act="lock" data-g="'+g+'" data-v="'+(l?0:1)+'">'+esc(l?A("unlock"):A("lock"))+'</button></div>';
  });
  h+='<div class="row"><button class="btn sm" data-act="lockall" data-v="1">'+esc(A("lockall"))+'</button><button class="btn ghost sm" data-act="lockall" data-v="0">'+esc(A("unlockall"))+'</button></div></div>';
  h+='<div class="card"><h3>'+esc(A("report"))+'</h3><button class="btn" data-act="report">'+esc(A("report"))+'</button>'+(ADM.rows?table():'')+'</div>';
  h+='<button class="btn ghost" data-act="clear">'+esc(A("clear"))+'</button><button class="btn ghost" data-act="close">'+esc(A("close"))+'</button>';
  admShow(h);
}
function refreshLocks(){return rpc("get_locks").then(function(o){ADM.locks=o||{};LK=ADM.locks;sync()})}
function setLock(g,v){return rpc("adm_lock",{p:PW,g:g,l:!!v})}
$("adm").addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),g=b.getAttribute("data-g"),v=b.getAttribute("data-v")==="1";
  if(a==="close"){admClose();return}
  if(a==="login"){
    var pw=($("apw")||{}).value||"";if(!pw)return;
    rpc("chk",{p:pw}).then(function(ok){
      if(ok!==true){askPw("bad");return}
      PW=pw;return refreshLocks().then(panel);
    }).catch(function(){askPw("net")});
  }else if(a==="lock"){setLock(g,v).then(refreshLocks).then(panel).catch(function(){})}
  else if(a==="lockall"){setLock("g1",v).then(function(){return setLock("g2",v)}).then(refreshLocks).then(panel).catch(function(){})}
  else if(a==="report"){rpc("adm_report",{p:PW}).then(function(r){ADM.rows=r||[];panel()}).catch(function(){})}
  else if(a==="clear"){if(confirm(A("sure")))rpc("adm_clear",{p:PW}).then(function(){ADM.rows=[];panel()}).catch(function(){})}
});
$("adm").addEventListener("change",function(e){if(e.target.id==="afl"){ADM.flt=e.target.value;panel()}});
$("adm").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="apw"){var b=$("adm").querySelector('[data-act="login"]');if(b)b.click()}});

draw();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
</script>
</body></html>
